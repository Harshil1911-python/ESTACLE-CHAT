<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4A90D9">
  <meta name="description" content="ESTACLE - Modern messaging application">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ESTACLE">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>ESTACLE</title>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="offline-banner" id="offlineBanner">You are offline. Some features may be unavailable.</div>
  
  <div id="authApp">
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <h1>ESTACLE</h1>
          <p>Secure messaging for everyone</p>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" class="auth-form">
          <div class="auth-error" id="loginError"></div>
          <div class="form-group">
            <label for="loginIdentifier">Email or Username</label>
            <input type="text" id="loginIdentifier" name="identifier" required autocomplete="username" placeholder="Enter email or username">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="Enter password">
          </div>
          <div class="form-group" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="loginRemember" checked style="width:auto;">
            <label for="loginRemember" style="margin:0;">Keep me logged in</label>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
          <div class="auth-switch">
            <a href="#" id="showForgot">Forgot password?</a>
            <span style="margin:0 8px;color:var(--border);">|</span>
            <a href="#" id="showRegister">Create account</a>
          </div>
        </form>
        
        <!-- Register Form -->
        <form id="registerForm" class="auth-form" style="display:none;">
          <div class="auth-error" id="registerError"></div>
          <div class="form-group">
            <label for="regDisplayName">Display Name</label>
            <input type="text" id="regDisplayName" name="display_name" required autocomplete="name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" name="username" required autocomplete="username" placeholder="Choose a username" pattern="[a-zA-Z0-9_]{3,30}">
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" required autocomplete="email" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" name="password" required autocomplete="new-password" placeholder="Min 8 characters with letter and number" minlength="8">
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
          <div class="auth-switch">
            Already have an account? <a href="#" id="showLogin">Sign in</a>
          </div>
        </form>
        
        <!-- Forgot Password Form -->
        <form id="forgotForm" class="auth-form" style="display:none;">
          <div class="auth-error" id="forgotError"></div>
          <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">Enter your email address and we will send you a password reset link.</p>
          <div class="form-group">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" name="email" required autocomplete="email" placeholder="your@email.com">
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Send Reset Link</button>
          <div class="auth-switch">
            <a href="#" id="backToLogin">Back to sign in</a>
          </div>
        </form>
        
        <!-- Reset Password Form -->
        <form id="resetForm" class="auth-form" style="display:none;">
          <div class="auth-error" id="resetError"></div>
          <div class="form-group">
            <label for="resetToken">Reset Token</label>
            <input type="text" id="resetToken" name="token" required placeholder="Paste reset token">
          </div>
          <div class="form-group">
            <label for="resetPassword">New Password</label>
            <input type="password" id="resetPassword" name="password" required minlength="8" placeholder="Min 8 characters with letter and number">
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Reset Password</button>
          <div class="auth-switch">
            <a href="#" id="backToLogin2">Back to sign in</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
    
    // Check if already logged in
    (async () => {
      try {
        const res = await API.get('/api/auth/me');
        if (res.user) {
          window.location.href = '/chat';
        }
      } catch (e) {}
    })();
    
    // Theme
    const savedTheme = localStorage.getItem('estacle-theme') || 'system';
    if (savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>
